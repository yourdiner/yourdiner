version: "3.9"

# Isolated from other projects that use a "docker" compose folder/project name.
name: cafe-pos-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-pos-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_os
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cafe-pos-system-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cafe-pos-system-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://restaurant:restaurant@postgres:5432/restaurant_os?schema=public
      DIRECT_URL: postgresql://restaurant:restaurant@postgres:5432/restaurant_os?schema=public
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
    name: cafe-pos-system-postgres-data
  redis_data:
    name: cafe-pos-system-redis-data
